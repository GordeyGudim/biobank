[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biobank"
version = "0.1.0"
description = "Информационный банк биологических данных: экспедиции во Вьетнам"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# веб-интерфейс (python -m biobank web): pip install -e '.[web]'
web = ["flask>=3.0"]

[project.scripts]
biobank = "biobank.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# шаблоны и статика сайта — не .py, их надо явно включить в пакет
[tool.setuptools.package-data]
"biobank.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
